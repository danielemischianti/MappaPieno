name: Diagnosi raggiungibilità MIMIT
on:
  push:
    branches: [diagnosi]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: API ospz
        run: |
          B=https://carburanti.mise.gov.it/ospzApi
          show () { label="$1"; shift; body=$(curl -sS -m 30 "$@" 2>&1 | head -c 700 | tr '\n\r' '  ' | sed 's/::/: :/g'); echo "::notice title=$label::$body"; }
          show "zona POST" -X POST -H "Content-Type: application/json" -d '{"points":[{"lat":41.82,"lng":12.69}],"radius":3}' $B/search/zone
          show "area POST RM" -X POST -H "Content-Type: application/json" -d '{"province":"RM","fuelType":"3-x","priceOrder":"asc"}' $B/search/area
          show "regioni" $B/registry/region
          show "province" "$B/registry/province?regionId=12"
          show "carburanti" $B/registry/fuels
          size=$(curl -sS -m 60 -X POST -H "Content-Type: application/json" -d '{"region":12,"fuelType":"3-x","priceOrder":"asc"}' $B/search/area | wc -c); echo "::notice title=area regione 12 bytes::$size"
          size=$(curl -sS -m 60 -X POST -H "Content-Type: application/json" -d '{"points":[{"lat":41.9,"lng":12.5}],"radius":50}' $B/search/zone | wc -c); echo "::notice title=zona 50km bytes::$size"
