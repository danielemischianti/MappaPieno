name: Diagnosi raggiungibilità MIMIT
on:
  push:
    branches: [diagnosi]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: API ospz area
        run: |
          B=https://carburanti.mise.gov.it/ospzApi
          q () { curl -sS -m 90 -X POST -H "Content-Type: application/json" -d "$1" $B/search/area; }
          q '{"region":9,"fuelType":"1-x","priceOrder":"asc"}' > b.json
          q '{"region":9,"fuelType":"3-x","priceOrder":"asc"}' > m.json
          q '{"region":9}' > n.json
          q '{"region":9,"province":"RM","fuelType":"3-x","priceOrder":"asc"}' > p.json
          python3 - <<'PY'
          import json
          for f in ["b.json","m.json","n.json","p.json"]:
              try:
                  d=json.load(open(f)); r=d.get("results") or []
                  print(f"::notice title={f}::success={d.get('success')} n={len(r)} keys={sorted(r[0].keys()) if r else None}")
              except Exception as e:
                  print(f"::notice title={f}::errore {e} {open(f).read()[:300]}")
          r=json.load(open("m.json"))["results"]
          one=next((x for x in r if x.get("id")==49315), r[0])
          print("::notice title=esempio::"+json.dumps(one,ensure_ascii=False)[:1800])
          ids=[x["id"] for x in json.load(open("b.json"))["results"]]
          print(f"::notice title=benzina Lazio::{len(ids)} impianti, id unici {len(set(ids))}")
          PY
