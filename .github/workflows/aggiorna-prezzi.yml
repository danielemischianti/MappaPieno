name: Aggiorna prezzi e pubblica

on:
  schedule:
    - cron: "7,37 4-21 * * *"   # ogni mezz'ora dalle 5 alle 23 circa (ora italiana); GitHub a volte salta o ritarda un giro
  workflow_dispatch:         # pulsante "Run workflow" per aggiornare a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Lascia vuoto per tutta Italia, oppure limita alle province: es. "RM,LT,FR,VT,RI"
  PROVINCE: ""

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Scarica prezzi MIMIT
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site/data
          # 1) servizio Osservaprezzi (carburanti.mise.gov.it): prezzi in vigore al momento della lettura
          # 2) se non risponde, i file CSV delle 8 (www.mimit.gov.it, da ottobre 2026 irraggiungibile da GitHub)
          # 3) se falliscono entrambi, i dati del giorno prima (massimo 3 giorni)
          python3 update_api.py --out _site/data/prezzi.json --precedente "$BASE/data/prezzi.json" \
            || python3 update.py --prov "$PROVINCE" --out _site/data/prezzi.json --fallback "$BASE/data/prezzi.json"
          cp index.html manifest.webmanifest _site/ && cp -r icons _site/
      - name: Aggiorna orari di apertura
        env:
          # a ogni giro si rileggono al massimo 300 schede, solo quelle più vecchie di 7 giorni
          # (in tutto circa 3000 al giorno); a ogni modifica del codice si riusano quelle già pubblicate
          ORARI_MAX: ${{ github.event_name == 'push' && '0' || '300' }}
        timeout-minutes: 25
        continue-on-error: true   # se il servizio orari non risponde, si pubblicano comunque i prezzi
        run: |
          python3 orari.py --prezzi _site/data/prezzi.json \
            --cache "${{ steps.pages.outputs.base_url }}/data/orari.json" \
            --out _site/data/orari.json --thread 4 \
            --max $ORARI_MAX
      - id: up1
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true   # il servizio artefatti di GitHub a volte risponde con un errore temporaneo
        with:
          path: _site
      - if: steps.up1.outcome == 'failure'
        run: sleep 60
      - if: steps.up1.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-retry
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ steps.up1.outcome == 'failure' && 'github-pages-retry' || 'github-pages' }}
